<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
</head>

<style>

    div.container {

             display: flex;
             background-color: aquamarine;
             height: 100px;
             
           /* junção das configurações flex-direction + flex-nowrap */

             flex-flow: column wrap-reverse;        

    }


    div.item {
            background-color: rgb(107, 105, 73);   border: 1px solid black;
            text-align: center;
            flex: auto; /* Não permite espaços em brancos no elemento pai (Container).*/
    }

</style>



<body>

    <div class="container">

        <div class="item">Exemplo de bloco A </div>
        <div class="item">Exemplo de bloco B </div>
        <div class="item">Exemplo de bloco C </div>
        <div class="item">Exemplo de bloco D </div>
        <div class="item">Exemplo de bloco E </div>
        <div class="item">Exemplo de bloco F </div>
        <div class="item">Exemplo de bloco G </div>

    </div>
    
</body>
</html>
