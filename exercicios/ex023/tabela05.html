<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> tabela</title>
</head>

<style>

    body {
        font-family: Arial, Helvetica, sans-serif;
    }

    table {
        width: 500px;
        border-collapse: collapse;
    }

    caption {
        font-size: 1.3em;
        font-weight: bolder;
        padding: 8px;

    }
    
    th, td {

        border: 1px solid black;
        padding: 8px;

    }

    col.nome{
        background-color: chartreuse;
    }

    col.sexo{
        background-color: rgb(0, 162, 255);
    }

    col.idade {
        background-color: rgb(255, 238, 0);
    }

    col.profisao{
        background-color: rgb(173, 100, 58);
    }



</style>

<body>
<h1> Exercício de Tabela</h1>

    <table>

        <colgroup>

            <col class="nome">
            <col class="sexo">
            <col class="idade">
            <col class="profisao">
        
        </colgroup>

        <caption>  Cadastro </caption>

        <tr>
             <th scope="col"> Nome </th>
             <th scope="col"> Sexo </th>
             <th scope="col"> Idade </th>
             <th scope="col"> Profissão </th>
        </tr>

          <tr>
             <td > Ana Maria </td>
             <td > F </td>
             <td > 25 </td>
             <td > Jornalista </td>
         </tr>

         <tr>
             <td > Claudio </td>
             <td > M </td>
             <td > 28 </td>
             <td > Programador </td>
         </tr>

         <tr>
             <td > Gustavo </td>
             <td > M </td>
             <td > 42 </td>
             <td > Professor </td>
         </tr>

         <tr>
             <td > Hélio </td>
             <td > M </td>
             <td > 19 </td>
             <td > Vendendor </td>
         </tr>

         <tr>
             <td > Maria </td>
             <td > F </td>
             <td > 39 </td>
             <td > Médica </td>
         </tr>

          <tr>
             <td > otàvio </td>
             <td > M </td>
             <td > 22 </td>
             <td > Nutricionista </td>
         </tr>


         



         







    </table>
    
</body>
</html>
