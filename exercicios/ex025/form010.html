<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Formulários </title>
</head>
<body>

     <form action="cadastro.php" method="post" autocomplete="on">
         <p>
             <label for="in1" > Em que ano vocè nasceu </label>
             <input type="number" name="ano" id="iano" min="1990" max="2026" required  oninput="CalcIdade( )"> </input>
         
         </p>

          <p>
             <label for="iidade"> Sua Idade é: </label>
           <output id="iidade">0</output>
         
         </p>
        
         <p>
         
             <input type="submit" value="Enviar">
             <input type="Reset" value="Limpar">
         </p>
     </form>
     <script> 

     function CalcIdade() {

        let atual = new Date().getFullYear()
        iidade.innerHTML = Number(atual) - Number(iano.value)
     }

     </script>

    
</body>
</html>
