<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    
    <form action="cadastro.php" method="get" autocomplete="on">

    <fieldset>
        <legend> Esportes Favoritos </legend>

        <br>

        <fieldset>

            <legend> Sexo </legend>

            <!-- No type="radio", o atributo name="" tem que ser iguais a todos os inputs, abaixo temos como exemplo o name "sexo" para os dois inputs ( name="sexo" ) -->

            <!-- Isso acontece porque as alternativas são de respostas únicas. Caso contrário, ou seja, se for opções que possam marcar mais de uma alternativa, cada "name" terá seus valores diferentes -->

            <!-- o Parâmetro ( checked ) dentro do input, permite que as caixas já estejãm marcadas automaticamente ao abrir o Formulário-->
            
            <!-- O Parâmetro ( checked ) no type="checkbox"é permitida mais de uma marcção pré-automática, enquanto no type="radio" só permite uma marcação pré-automátia-->



            <input type="radio" name="sexo" id="ifem" checked > <label for="ifem"> Ferminino </label> <br>
            <input type="radio" name="sexo" id="imas"> <label for="imas"> Masculino </label> <br>

        </fieldset>


        <br>



        <input type="checkbox" name="fut" id="ifut" checked> <label for="ifut">  Futebol </label> <br>
        <input type="checkbox" name="basq" id="ibasq" checked> <label for="ibasq">  Basquete </label> <br>
        <input type="checkbox" name="beis" id="ibais"> <label for="ibais">  Baisebol </label> <br>
        <input type="checkbox" name="nat" id="inat"> <label for="inat">  Natação </label> <br>
        
        <br>

        <input type="submit" value="enviar">
        <input type="reset" value="Limpar">
    </fieldset>
    
    </form>
</body>
</html>
